<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#1e293b" stroke-width="4" stroke-opacity="0.6"/>
  
  <!-- Subtle grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6"/>
  
  <!-- Candlestick 1 -->
  <line x1="150" y1="210" x2="150" y2="360" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <rect x="134" y="240" width="32" height="85" rx="6" fill="url(#emerald)"/>

  <!-- Candlestick 2 -->
  <line x1="256" y1="170" x2="256" y2="330" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <rect x="240" y="200" width="32" height="100" rx="6" fill="url(#emerald)"/>

  <!-- Candlestick 3 (Breakout) -->
  <line x1="362" y1="110" x2="362" y2="280" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <rect x="346" y="140" width="32" height="105" rx="6" fill="url(#emerald)" filter="url(#glow)"/>

  <!-- Ascending trend arrow & glowing trail -->
  <path d="M 110 380 Q 240 330 395 130" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <polygon points="410,115 385,130 402,145" fill="#34d399"/>
</svg>
